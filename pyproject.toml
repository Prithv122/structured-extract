[project]
name = "structured-extract"
version = "0.1.0"
description = "Extract validated, evidence-grounded records of DuckDB configuration settings from real documentation prose, and score every field against the binary's own `duckdb_settings()` — a free, exact oracle for 280 settings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pydantic>=2.13.5",
]

# Most projects here ship a CLI. Entry points REQUIRE a real build backend —
# a uv virtual project ([tool.uv] package = false) installs nothing, so the
# documented command fails with "No module named ..." even while tests pass
# (pytest's pythonpath hides it). Bit us on A1, nearly again on A3.
# No-CLI projects (static sites, notebooks-only): delete [project.scripts];
# the build backend is harmless to keep.
[project.scripts]
structured-extract = "structured_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ⚠️ When /new-project renames src/app, update BOTH the line below AND the
# [project.scripts] target above.
[tool.hatch.build.targets.wheel]
packages = ["src/structured_extract"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# `ruff format` formats fenced code blocks inside markdown. The corpus documents
# are verbatim excerpts of DuckDB's docs whose sha256 is committed in the
# manifest, so formatting one would silently break `corpus verify` -- and it
# nearly did: CI caught a pandas snippet in narrative-0013.md being rewrapped.
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
