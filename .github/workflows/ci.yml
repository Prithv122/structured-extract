name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly, for the `arms-live` job only: a pinned model id can be retired
    # months after the grid was published, and a benchmark whose arms no longer
    # exist should say so rather than wait to be noticed by a reader.
    - cron: "0 6 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

  # Reads OpenRouter's *public* model catalogue. No API key, no spend, and no
  # part of the extraction grid. Kept out of the PR path because a provider
  # outage must not turn a documentation typo into a red build.
  arms-live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-groups
      - name: Pinned model ids still resolve
        run: uv run pytest -m live
